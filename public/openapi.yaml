        - name: action
          in: query
          schema: { type: string }
        - name: search
          in: query
          description: Busca na descrição — só tipos com nível full para o perfil
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Eventos paginados + capabilities do perfil
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/TimelineEvent" }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                  capabilities: { $ref: "#/components/schemas/AuditViewerCapabilities" }
                  allowedEntityTypes:
                    type: array
                    items: { type: string }
                  filters:
                    type: object
                    properties:
                      entityTypes:
                        type: array
                        items:
                          type: object
                          properties:
                            value: { type: string }
                            label: { type: string }
                      actions:
                        type: array
                        items: { type: string }
        "401":
          description: Não autenticado
        "403":
          description: Sem módulo auditoria
