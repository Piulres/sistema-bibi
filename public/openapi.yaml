    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Interno]
      summary: Despacha mensagem via provider configurado
      responses:
        '200':
          description: Mensagem enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/MessageView' }
        '400': { description: Provider não configurado ou mensagem inválida }
        '404': { description: Mensagem não encontrada }

  /api/beneficiario/overview:
    get:
      tags: [Beneficiário]
      summary: Visão self-service do beneficiário logado
      description: >
        Retorna agenda, consumo Pay Per Use, faturas, assinatura e prontuário
        do beneficiário vinculado à sessão (`user.patientId`). Somente leitura.
      responses:
        '200':
          description: Overview consolidado do beneficiário
          content:
            application/json:
              schema:
                type: object
                properties:
                  overview:
                    allOf:
                      - { $ref: '#/components/schemas/PatientOverview' }
                      - type: object
                        properties:
                          subscriptions:
                            type: array
                            items: { $ref: '#/components/schemas/SubscriptionView' }
                          nextAppointment:
                            type: object
                            nullable: true
        '403': { description: Acesso negado ou conta sem beneficiário vinculado }
        '404': { description: Beneficiário não encontrado }

  /api/pj/overview:
    get:
      tags: [PJ]
      summary: Visão da empresa (contrato, beneficiários e faturas)
      responses:
        '200':
          description: Dados consolidados da empresa do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    type: object
                    properties:
                      name: { type: string }
                      cnpj: { type: string }
                      status:
                        type: string
                        enum: [LEAD, PROPOSTA, NEGOCIACAO, ATIVO, INADIMPLENTE, CANCELADO]
                      contractActive: { type: boolean }
                      beneficiariesCount: { type: integer }
                      totalConsumed: { type: number }
                      totalConsumedLabel: { type: string }
                  beneficiaries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        cpf: { type: string }
                        usageCount: { type: integer }
                        consumed: { type: number }
                        consumedLabel: { type: string }
                  invoices:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        total: { type: number }
                        totalLabel: { type: string }
                        status: { type: string }
                        createdAt: { type: string, format: date-time }
        '400': { description: Usuário sem empresa vinculada }
        '403': { description: Acesso negado (role != PJ) }

  /api/pj/reports:
    get:
      tags: [PJ]
      summary: Export CSV corporativo (consumo, faturas, assinaturas)
