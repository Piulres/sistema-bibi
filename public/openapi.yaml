        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { description: MFA habilitado }

  /api/auth/mfa/verify:
    post:
      tags: [MFA]
      summary: Segunda etapa do login quando MFA está ativo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken, code]
              properties:
                mfaToken: { type: string }
                code: { type: string }
      responses:
        '200': { description: Sessão criada }
        '401': { description: Código inválido }

  /api/interno/patients:
    get:
      tags: [Interno]
