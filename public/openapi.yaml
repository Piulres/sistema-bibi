        Retorna resposta, ações pendentes e links de navegação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
                pageContext: { type: string }
      responses:
        '200': { description: Resposta do assistente }
        '400': { description: Requisição inválida ou sem mensagem do usuário }
        '403': { description: Portal não suportado }
        '503': { description: Assistente desabilitado }

