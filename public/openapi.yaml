      responses:
        '200': { description: Agendamentos }
    post:
      tags: [Interno]
      summary: Cria agendamento
      responses:
        '200': { description: Agendamento criado }

  /api/interno/calendar:
    get:
      tags: [Interno]
      summary: Status do feed ICS operacional do tenant
      responses:
        '200': { description: feed ativo ou null }
    post:
      tags: [Interno]
