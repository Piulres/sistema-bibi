openapi: 3.0.3
info:
  title: Sistema Bibi - ServiceOS — API
  version: 3.0.23
  description: >
    API do Sistema Bibi - ServiceOS v3.0.17 — plataforma Pay Per Use multi-nicho. Multi-tenant,
    quatro portais segregados por `role`, vocabulário adaptável por segmento.

    Autenticação por cookie de sessão httpOnly (`bibi_session`) assinado via
    HMAC-SHA256, obtido em `POST /api/auth/login`.

    Fluxos: docs/produto/FLUXOS.md · Arquitetura: docs/plataforma/ARQUITETURA.md
externalDocs:
  description: Fluxos do sistema (Mermaid)
  url: /docs/produto/FLUXOS.md
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
  - url: https://sistema-bibi.netlify.app
    description: Produção (Netlify)

tags:
  - name: Auth
    description: Autenticação e sessão
  - name: Prestador
    description: Portal do Prestador (role PRESTADOR)
  - name: Interno
    description: Portal Interno — faturamento (role INTERNO)
  - name: PJ
    description: Portal da Empresa (role PJ)
  - name: Beneficiário
    description: Portal do Beneficiário — self-service (role BENEFICIARIO)
  - name: Catálogo
    description: Catálogo de procedimentos
  - name: Cron
    description: Jobs agendados (header x-cron-secret)
  - name: MFA
    description: Autenticação em dois fatores (INTERNO)
  - name: Assistente
    description: Chat operacional com confirmação de ações (4 portais)
  - name: Pets
    description: Ficha clínica por pet (nicho VET)
  - name: Importação
    description: Interchange JSON/CSV para cadastros
  - name: Voa
    description: Integração Voa Health — IA clínica no atendimento
  - name: Estoque
    description: Gestão de estoque médico (produtos, lotes, movimentações)
  - name: Segmento
    description: Persistência de segmento/tenant na landing
  - name: Change Management
    description: Reversão de alterações e auditoria com restore

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bibi_session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Não autenticado
    LoginRequest:
      type: object
      required: [email, password, portal]
      properties:
        email:
          type: string
          format: email
          example: dra.helena@bibi.health
        password:
          type: string
          example: bibi123
        portal:
          type: string
          enum: [prestador, interno, pj, beneficiario]
          example: prestador
    LoginResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            role: { type: string, enum: [PRESTADOR, INTERNO, PJ, BENEFICIARIO] }
        redirectTo:
          type: string
          example: /prestador
    SessionUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [PRESTADOR, INTERNO, PJ, BENEFICIARIO] }
        tenantId: { type: string }
        companyId: { type: string, nullable: true }
        tenantName: { type: string }
        companyName: { type: string, nullable: true }
        patientId: { type: string, nullable: true }
        patientName: { type: string, nullable: true }
        branding:
          type: object
          description: Identidade visual white-label do tenant
          properties:
            displayName: { type: string }
            tagline: { type: string, nullable: true }
            logoUrl: { type: string, nullable: true }
            primaryColor: { type: string, example: '#1e293b' }
            accentColor: { type: string }
            heroFrom: { type: string }
            heroTo: { type: string }
            platformLabel: { type: string }
            colorScheme:
              type: string
              enum: [light, dark, system]
    BrandingTokens:
      type: object
      properties:
        displayName: { type: string }
        tagline: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        primaryColor: { type: string, example: '#1e293b' }
        accentColor: { type: string }
        heroFrom: { type: string }
        heroTo: { type: string }
        platformLabel: { type: string }
        colorScheme:
          type: string
          enum: [light, dark, system]
    AgendaItem:
      type: object
      properties:
        id: { type: string }
        scheduledAt: { type: string, format: date-time }
        status:
          type: string
          enum: [AGENDADO, CONFIRMADO, REALIZADO, FALTOU, CANCELADO]
        reason: { type: string, nullable: true }
        patient:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            company: { type: string, nullable: true }
        proceduresCount: { type: integer }
    Usage:
      type: object
      properties:
        id: { type: string }
        procedure: { type: string }
        category: { type: string, enum: [CONSULTA, EXAME] }
        priceCharged: { type: number }
        priceLabel: { type: string, example: "R$ 220,00" }
        billed: { type: boolean }
    AppointmentDetail:
      type: object
      properties:
        appointment:
          type: object
          properties:
            id: { type: string }
            scheduledAt: { type: string, format: date-time }
            status: { type: string }
            reason: { type: string, nullable: true }
        patient:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            cpf: { type: string }
            company: { type: string, nullable: true }
            companyId: { type: string, nullable: true }
        usages:
          type: array
          items: { $ref: '#/components/schemas/Usage' }
        records:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              content: { type: string }
              createdAt: { type: string, format: date-time }
    Procedure:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        category: { type: string, enum: [CONSULTA, EXAME] }
        basePrice: { type: number }
        basePriceLabel: { type: string }
    PatientOverview:
      type: object
      description: Visão Cliente 360° consolidada de um beneficiário.
      properties:
        patient:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            cpf: { type: string }
            birthDate: { type: string, format: date-time }
            birthDateLabel: { type: string }
            phone: { type: string, nullable: true }
            company:
              type: object
              nullable: true
              properties:
                id: { type: string }
                name: { type: string }
                cnpj: { type: string }
            createdAt: { type: string, format: date-time }
            createdAtLabel: { type: string }
        summary:
          type: object
          properties:
            totalAppointments: { type: integer }
            totalUsages: { type: integer }
            totalRecords: { type: integer }
            totalInvoiced: { type: number }
            totalInvoicedLabel: { type: string }
            pendingAmount: { type: number }
            pendingAmountLabel: { type: string }
        appointments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              scheduledAt: { type: string, format: date-time }
              scheduledAtLabel: { type: string }
              status: { type: string }
              reason: { type: string, nullable: true }
              providerName: { type: string }
              usagesCount: { type: integer }
        usages:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              procedure: { type: string }
              category: { type: string }
              priceCharged: { type: number }
              priceLabel: { type: string }
              billed: { type: boolean }
              performedAt: { type: string, format: date-time }
              performedAtLabel: { type: string }
              appointmentId: { type: string }
              appointmentDateLabel: { type: string }
        medicalRecords:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              content: { type: string }
              createdAt: { type: string, format: date-time }
              createdAtLabel: { type: string }
              providerName: { type: string }
              appointmentDateLabel: { type: string, nullable: true }
        invoices:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              total: { type: number }
              totalLabel: { type: string }
              status: { type: string }
              createdAt: { type: string, format: date-time }
              createdAtLabel: { type: string }
              company: { type: string, nullable: true }
              items:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    description: { type: string }
                    amount: { type: number }
                    amountLabel: { type: string }
        timeline:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              entityType: { type: string }
              entityId: { type: string }
              action:
                type: string
                enum:
                  - LOGIN
                  - CREATED
                  - UPDATED
                  - APPOINTMENT_COMPLETED
                  - PROCEDURE_REGISTERED
                  - MEDICAL_RECORD_CREATED
                  - INVOICE_ISSUED
                  - CHARGE_SENT
                  - CONTRACT_CHANGED
                  - SUBSCRIPTION_CHARGES_GENERATED
                  - MESSAGE_QUEUED
                  - MESSAGE_SENT
                  - MESSAGE_FAILED
              description: { type: string }
              createdAt: { type: string, format: date-time }
              createdAtLabel: { type: string }
              createdBy: { type: string, nullable: true }
              actorName: { type: string, nullable: true }
    TimelineEvent:
      type: object
      description: Evento de auditoria universal do sistema (já redigido por RBAC de conteúdo).
      properties:
        id: { type: string }
        tenantId: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        action: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true }
        actorName: { type: string, nullable: true }
        hasDiff: { type: boolean }
        reversible: { type: boolean }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
    AuditViewerCapabilities:
      type: object
      description: Capacidades do perfil interno sobre a auditoria.
      properties:
        profile:
          type: string
          enum: [ADMIN, FATURAMENTO, RECEPCAO, READONLY]
        canRestore: { type: boolean }
        canExport: { type: boolean }
        canViewFullDiff: { type: boolean }
      required: [profile, canRestore, canExport, canViewFullDiff]
    SubscriptionView:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          enum: [ATIVA, SUSPENSA, CANCELADA]
        statusLabel: { type: string }
        billingCycle:
          type: string
          enum: [MENSAL, TRIMESTRAL, SEMESTRAL, ANUAL]
        billingCycleLabel: { type: string }
        startDate: { type: string, format: date-time }
        startDateLabel: { type: string }
        endDate: { type: string, format: date-time, nullable: true }
        endDateLabel: { type: string, nullable: true }
        amount: { type: number }
        amountLabel: { type: string }
        description: { type: string, nullable: true }
        patientId: { type: string }
        patientName: { type: string }
        companyId: { type: string, nullable: true }
        companyName: { type: string, nullable: true }
        pendingCharges: { type: integer }
        nextDueDate: { type: string, format: date-time, nullable: true }
        nextDueDateLabel: { type: string, nullable: true }
    SubscriptionChargeView:
      type: object
      properties:
        id: { type: string }
        dueDate: { type: string, format: date-time }
        dueDateLabel: { type: string }
        amount: { type: number }
        amountLabel: { type: string }
        status:
          type: string
          enum: [PENDENTE, FATURADA, CANCELADA]
        invoiceId: { type: string, nullable: true }
    MessageView:
      type: object
      properties:
        id: { type: string }
        channel:
          type: string
          enum: [EMAIL, SMS, WHATSAPP]
        channelLabel: { type: string }
        template:
          type: string
          enum: [APPOINTMENT_REMINDER, INVOICE_DUE, SUBSCRIPTION_DUE, GENERIC]
        templateLabel: { type: string }
        subject: { type: string, nullable: true }
        body: { type: string }
        status:
          type: string
          enum: [PENDENTE, ENVIADA, FALHA, CANCELADA]
        statusLabel: { type: string }
        externalId: { type: string, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        sentAtLabel: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdAtLabel: { type: string }
        patientId: { type: string }
        patientName: { type: string }
        patientPhone: { type: string, nullable: true }
    ExecutiveDashboard:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        generatedAtLabel: { type: string }
        kpis:
          type: object
          properties:
            totalPatients: { type: integer }
            totalCompanies: { type: integer }
            appointmentsToday: { type: integer }
            pendingBillingLabel: { type: string }
            totalInvoicedLabel: { type: string }
            activeSubscriptions: { type: integer }
            mrrEstimateLabel: { type: string }
            pendingMessages: { type: integer }
            pendingRecurrenceCharges: { type: integer }
        revenue:
          type: object
          properties:
            pendingPayPerUseLabel: { type: string }
            pendingRecurrenceLabel: { type: string }
            invoicedOpenLabel: { type: string }
            invoicedPaidLabel: { type: string }
        crm:
          type: object
          properties:
            activeContracts: { type: integer }
            byStatus:
              type: array
              items:
                type: object
                properties:
                  status: { type: string }
                  label: { type: string }
                  count: { type: integer }
        topPendingBilling:
          type: array
          items:
            type: object
            properties:
              patientId: { type: string }
              patientName: { type: string }
              totalLabel: { type: string }
              itemsCount: { type: integer }
        recentActivity:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              action: { type: string }
              description: { type: string }
              createdAtLabel: { type: string }
              actorName: { type: string, nullable: true }
    CompanyPipelineCard:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        cnpj: { type: string }
        status:
          type: string
          enum: [LEAD, PROPOSTA, NEGOCIACAO, ATIVO, INADIMPLENTE, CANCELADO]
        statusLabel: { type: string }
        contractActive: { type: boolean }
        beneficiariesCount: { type: integer }
        invoicesCount: { type: integer }
        createdAt: { type: string, format: date-time }

security:
  - sessionCookie: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Autentica e cria a sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login bem-sucedido (define o cookie de sessão)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { description: Dados inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: E-mail ou senha incorretos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Conta sem acesso ao portal, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Encerra a sessão
      responses:
        '200': { description: OK }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Usuário da sessão atual
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '401': { description: Não autenticado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/prestador/agenda:
    get:
      tags: [Prestador]
      summary: Agenda do dia do prestador logado
      responses:
        '200':
          description: Lista de agendamentos de hoje
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items: { $ref: '#/components/schemas/AgendaItem' }
        '401': { description: Não autenticado }
        '403': { description: Acesso negado (role != PRESTADOR) }

  /api/prestador/availability:
    get:
      tags: [Prestador]
      summary: Grade semanal de disponibilidade do prestador
      responses:
        '200': { description: Janelas + flag usingDefault }
    put:
      tags: [Prestador]
      summary: Substitui a grade semanal publicada
      responses:
        '200': { description: Grade salva }

  /api/prestador/availability/blocks:
    get:
      tags: [Prestador]
      summary: Lista bloqueios pontuais
      responses:
        '200': { description: Bloqueios }
    post:
      tags: [Prestador]
      summary: Cria bloqueio (almoço/folga/férias)
      responses:
        '200': { description: Bloqueio criado }

  /api/prestador/availability/blocks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Prestador]
      summary: Remove bloqueio
      responses:
        '200': { description: Removido }

  /api/prestador/availability/preview:
    get:
      tags: [Prestador]
      summary: Prévia de slots livres em uma data
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lista de slots }

  /api/prestador/calendar:
    get:
      tags: [Prestador]
      summary: Status do feed ICS pessoal do prestador
      responses:
        '200': { description: feed ativo ou null }
    post:
      tags: [Prestador]
      summary: Cria ou rotaciona o feed ICS pessoal
      responses:
        '200': { description: Feed gerado }
    delete:
      tags: [Prestador]
      summary: Revoga o feed ICS pessoal
      responses:
        '200': { description: Feed revogado }

  /api/prestador/appointments/{id}/calendar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: format
        in: query
        required: false
        schema: { type: string, enum: [ics] }
    get:
      tags: [Prestador]
      summary: Links Google/Outlook e ICS de um agendamento
      responses:
        '200': { description: JSON com links ou arquivo text/calendar }
        '404': { description: Agendamento não encontrado }

  /api/calendar/feed/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Público]
      summary: Feed ICS assinável (Google / Outlook / Apple)
      responses:
        '200':
          description: text/calendar
        '404': { description: Token inválido ou revogado }

  /api/calendar/oauth/{provider}/start:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [google, microsoft] }
      - name: scope
        in: query
        schema: { type: string, enum: [PROVIDER, TENANT] }
      - name: returnTo
        in: query
        schema: { type: string }
    get:
      tags: [Público]
      summary: Inicia OAuth Google/Microsoft Calendar
      responses:
        '302': { description: Redirect ao provedor }
        '503': { description: Credenciais OAuth não configuradas }

  /api/calendar/oauth/{provider}/callback:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [google, microsoft] }
    get:
      tags: [Público]
      summary: Callback OAuth — grava CalendarConnection
      responses:
        '302': { description: Redirect de volta ao portal }

  /api/prestador/calendar/connections/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [google, microsoft] }
    delete:
      tags: [Prestador]
      summary: Desconecta calendário OAuth do prestador
      responses:
        '200': { description: Desconectado }

  /api/interno/calendar/connections/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [google, microsoft] }
    delete:
      tags: [Interno]
      summary: Desconecta calendário OAuth da operação
      responses:
        '200': { description: Desconectado }

  /api/prestador/appointments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Prestador]
      summary: Detalhe do atendimento (procedimentos + prontuário)
      responses:
        '200':
          description: Detalhe do atendimento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentDetail' }
        '404': { description: Agendamento não encontrado }
    patch:
      tags: [Prestador]
      summary: Atualiza o status do atendimento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [AGENDADO, CONFIRMADO, REALIZADO, FALTOU, CANCELADO]
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string }
        '400': { description: Status inválido }
        '404': { description: Agendamento não encontrado }

  /api/prestador/appointments/{id}/procedures:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Prestador]
      summary: Registra um procedimento utilizado (Pay Per Use)
      description: >
        O preço é calculado com a precificação dinâmica (regras por empresa) e
        congelado no momento do uso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [procedureId]
              properties:
                procedureId: { type: string }
      responses:
        '200':
          description: Procedimento registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage: { $ref: '#/components/schemas/Usage' }
        '400': { description: Procedimento não informado }
        '404': { description: Agendamento não encontrado }

  /api/prestador/records:
    post:
      tags: [Prestador]
      summary: Adiciona uma anotação ao prontuário (PEP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, content]
              properties:
                patientId: { type: string }
                appointmentId: { type: string, nullable: true }
                content: { type: string }
      responses:
        '200':
          description: Anotação criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  record:
                    type: object
                    properties:
                      id: { type: string }
                      content: { type: string }
                      createdAt: { type: string, format: date-time }
        '400': { description: Dados inválidos }

  /api/procedures:
    get:
      tags: [Catálogo]
      summary: Catálogo de procedimentos do tenant
      description: Acessível pelos roles PRESTADOR e INTERNO.
      responses:
        '200':
          description: Lista de procedimentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  procedures:
                    type: array
                    items: { $ref: '#/components/schemas/Procedure' }

  /api/interno/branding:
    get:
      tags: [Interno]
      summary: Identidade visual white-label do tenant
      responses:
        '200':
          description: Branding atual
          content:
            application/json:
              schema:
