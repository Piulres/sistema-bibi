      responses:
        '200':
          description: SVG da marca do tenant
          content:
            image/svg+xml:
              schema: { type: string }

  /api/interno/dashboard:
    get:
      tags: [Interno]
      summary: Dashboard Executivo — KPIs consolidados do tenant
      description: >
        Agrega receita Pay Per Use, recorrência (MRR), CRM, comunicação e
        atividade recente da Timeline.
      responses:
        '200':
          description: KPIs executivos
          content:
            application/json:
              schema:
                type: object
                properties:
                  dashboard: { $ref: '#/components/schemas/ExecutiveDashboard' }
        '403': { description: Acesso negado (role != INTERNO) }

  /api/interno/billing:
    get:
      tags: [Interno]
      summary: Painel de faturamento (pendentes + faturas)
      responses:
        '200':
          description: Procedimentos pendentes agrupados por paciente e faturas emitidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items:
                      type: object
                      properties:
                        patientId: { type: string }
                        patientName: { type: string }
                        company: { type: string, nullable: true }
                        total: { type: number }
                        totalLabel: { type: string }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string }
                              procedure: { type: string }
                              priceLabel: { type: string }
                  invoices:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        patientId: { type: string }
                        patientName: { type: string }
                        company: { type: string, nullable: true }
                        total: { type: number }
                        totalLabel: { type: string }
                        status: { type: string }
                        itemsCount: { type: integer }
                        createdAt: { type: string, format: date-time }
        '403': { description: Acesso negado (role != INTERNO) }

  /api/interno/invoices:
    post:
      tags: [Interno]
      summary: Gera a fatura Pay Per Use de um paciente
      description: Agrega todos os procedimentos não faturados do paciente e os marca como faturados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId]
              properties:
                patientId: { type: string }
      responses:
        '200':
          description: Fatura gerada
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice:
                    type: object
                    properties:
                      id: { type: string }
                      total: { type: number }
                      totalLabel: { type: string }
                      status: { type: string }
                      itemsCount: { type: integer }
        '400': { description: Sem procedimentos pendentes ou paciente não informado }
        '404': { description: Paciente não encontrado }

  /api/interno/patients/{id}/overview:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Interno]
      summary: Visão Cliente 360° de um beneficiário
      description: >
        Consolida dados pessoais, empresa, atendimentos, procedimentos Pay Per Use,
        prontuário eletrônico e faturas em uma única resposta (sem duplicar dados).
      responses:
        '200':
          description: Overview consolidado do beneficiário
          content:
            application/json:
              schema:
                type: object
                properties:
                  overview: { $ref: '#/components/schemas/PatientOverview' }
        '403': { description: Acesso negado (role != INTERNO) }
        '404': { description: Beneficiário não encontrado }

  /api/interno/crm/pipeline:
    get:
      tags: [Interno]
      summary: Pipeline CRM corporativo
      description: Empresas do tenant agrupadas por status (LEAD a CANCELADO).
      responses:
        '200':
          description: Pipeline com empresas por coluna
          content:
            application/json:
              schema:
                type: object
                properties:
                  statuses:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        label: { type: string }
                  companies:
                    type: array
                    items: { $ref: '#/components/schemas/CompanyPipelineCard' }
                  pipeline:
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: '#/components/schemas/CompanyPipelineCard' }
        '403': { description: Acesso negado (role != INTERNO) }

  /api/interno/companies/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Interno]
      summary: Atualiza status CRM de uma empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [LEAD, PROPOSTA, NEGOCIACAO, ATIVO, INADIMPLENTE, CANCELADO]
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  company: { $ref: '#/components/schemas/CompanyPipelineCard' }
        '400': { description: Status inválido }
        '404': { description: Empresa não encontrada }

  /api/interno/subscriptions:
    get:
      tags: [Interno]
      summary: Lista assinaturas recorrentes do tenant
      responses:
        '200':
          description: Assinaturas e beneficiários disponíveis para cadastro
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items: { $ref: '#/components/schemas/SubscriptionView' }
                  patients:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
        '403': { description: Acesso negado (role != INTERNO) }
    post:
      tags: [Interno]
      summary: Cria uma assinatura recorrente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, billingCycle, startDate, amount]
              properties:
                patientId: { type: string }
                companyId: { type: string, nullable: true }
                status:
                  type: string
                  enum: [ATIVA, SUSPENSA, CANCELADA]
                  default: ATIVA
                billingCycle:
                  type: string
                  enum: [MENSAL, TRIMESTRAL, SEMESTRAL, ANUAL]
                startDate: { type: string, format: date-time }
                endDate: { type: string, format: date-time, nullable: true }
                amount: { type: number, minimum: 0.01 }
                description: { type: string, nullable: true }
      responses:
        '200':
          description: Assinatura criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription: { $ref: '#/components/schemas/SubscriptionView' }
        '400': { description: Dados inválidos }
        '404': { description: Beneficiário não encontrado }

  /api/interno/subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Interno]
      summary: Atualiza status de uma assinatura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ATIVA, SUSPENSA, CANCELADA]
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription: { $ref: '#/components/schemas/SubscriptionView' }
        '400': { description: Status inválido }
        '404': { description: Assinatura não encontrada }

  /api/interno/subscriptions/{id}/generate-charges:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Interno]
      summary: Gera cobranças futuras pendentes de uma assinatura ativa
      responses:
        '200':
          description: Cobranças geradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription: { $ref: '#/components/schemas/SubscriptionView' }
                  generatedCount: { type: integer }
        '400': { description: Assinatura inativa ou sem cobranças a gerar }
        '404': { description: Assinatura não encontrada }

  /api/interno/subscriptions/{id}/charges:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Interno]
      summary: Lista cobranças de uma assinatura
      responses:
        '200':
          description: Cobranças da assinatura
          content:
            application/json:
              schema:
                type: object
                properties:
                  charges:
                    type: array
                    items: { $ref: '#/components/schemas/SubscriptionChargeView' }
        '404': { description: Assinatura não encontrada }

  /api/interno/messages:
    get:
      tags: [Interno]
      summary: Fila de comunicações do tenant
      responses:
        '200':
          description: Mensagens, beneficiários e status do provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/MessageView' }
                  patients:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        phone: { type: string, nullable: true }
                  providerConfigured: { type: string, nullable: true }
        '403': { description: Acesso negado (role != INTERNO) }
    post:
      tags: [Interno]
      summary: Enfileira uma comunicação outbound
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, channel, template, body]
              properties:
                patientId: { type: string }
                channel:
                  type: string
                  enum: [EMAIL, SMS, WHATSAPP]
                template:
                  type: string
                  enum: [APPOINTMENT_REMINDER, INVOICE_DUE, SUBSCRIPTION_DUE, GENERIC]
                subject: { type: string, nullable: true }
                body: { type: string }
      responses:
        '200':
          description: Mensagem enfileirada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/MessageView' }
        '400': { description: Dados inválidos }
        '404': { description: Beneficiário não encontrado }

  /api/interno/messages/template:
    get:
      tags: [Interno]
      summary: Sugere assunto e corpo para um template
      parameters:
        - name: patientId
          in: query
          required: true
          schema: { type: string }
        - name: template
          in: query
          required: true
          schema:
            type: string
            enum: [APPOINTMENT_REMINDER, INVOICE_DUE, SUBSCRIPTION_DUE, GENERIC]
      responses:
        '200':
          description: Sugestão de texto
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestion:
                    type: object
                    properties:
                      subject: { type: string, nullable: true }
                      body: { type: string }
        '400': { description: Parâmetros inválidos }
        '404': { description: Beneficiário não encontrado }

  /api/interno/messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Interno]
      summary: Cancela mensagem pendente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [cancel]
      responses:
        '200':
          description: Mensagem cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/MessageView' }
        '400': { description: Ação inválida ou status incorreto }
        '404': { description: Mensagem não encontrada }

