name: CI

on:
  push:
    branches: [main, dev, "cursor/**"]
  pull_request:
    branches: [main, dev]

# Prisma exige DATABASE_URL em todo comando que toca o schema.
# Dual-store: bootstrap gera demo.db + operation.db + espelho dev.db (db:verify).
env:
  DATABASE_URL: file:./dev.db
  SESSION_SECRET: ci-github-actions-session-secret-32chars-min
  CRON_SECRET: ci-cron-secret-32-characters-min
  SEED_SCALE: small
  ALLOW_DEMO_RESET: "true"

jobs:
  unit-integration-api:
    name: Unit + API (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Docs verify
        run: npm run docs:verify

      - name: OpenAPI verify
        run: npm run openapi:verify

      - name: Prepare database (dual-store)
        run: npm run db:bootstrap:demo

      - name: Database verify
        run: npm run db:verify

      - name: Vitest — unit, integration e API
        run: npm run test
        env:
          DATABASE_URL: file:./test.db
          CI: true

      - name: Job Summary — Vitest
        if: always()
        run: node scripts/ci-vitest-summary.mjs

      - name: Upload Vitest JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: reports/vitest-junit.xml
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: unit-integration-api
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database (dual-store)
        run: npm run db:bootstrap:demo

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Playwright — chromium e mobile
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_PORT: "3100"

      - name: Job Summary — Playwright
        if: always()
        run: |
          {
            echo "## Playwright — resumo"
            echo ""
            if [ -f reports/playwright-junit.xml ]; then
              tests=$(grep -o 'tests="[0-9]*"' reports/playwright-junit.xml | head -1 | tr -dc '0-9')
              failures=$(grep -o 'failures="[0-9]*"' reports/playwright-junit.xml | head -1 | tr -dc '0-9')
              skipped=$(grep -o 'skipped="[0-9]*"' reports/playwright-junit.xml | head -1 | tr -dc '0-9')
              echo "| Métrica | Valor |"
              echo "|---|---:|"
              echo "| Casos (attr suite) | ${tests:-?} |"
              echo "| Falhas | ${failures:-?} |"
              echo "| Pulados | ${skipped:-?} |"
              echo ""
              if [ "${failures:-0}" != "0" ]; then
                echo "### Casos com falha (amostra)"
                echo ""
                grep -E 'testcase |failure ' reports/playwright-junit.xml | head -40 | sed 's/^/    /'
              else
                echo "> E2E verde. Títulos dos testes devem descrever o fluxo de negócio (WHAT+WHY)."
              fi
            else
              echo "JUnit Playwright não encontrado (\`reports/playwright-junit.xml\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            reports/playwright-junit.xml
          if-no-files-found: ignore
